<content>
  <ul>
<li>Ocaml은 보수적 언어로, 안정적이지만 변화가 더디다.</li>
<li>Jane Street가 개발한 Dune 같은 도구가 생태계를 발전시켰지만, 언어 자체는 크게 바뀌지 않는다.</li>
<li>반면, Lean은 더 자주 바뀌고 매크로 작성이 쉬워 변화에 빠르게 대응할 수 있다.</li>
<li>Ocaml 숙련자들은 매크로 변수 이름 충돌 같은 문제는 걱정하지 않지만, Lean은 이러한 걸 직접 해결해주고, 또한 매크로 작성도 훨씬 쉽다.</li>
</ul>
